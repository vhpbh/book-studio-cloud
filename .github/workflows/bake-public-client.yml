name: Bake opaque public client

on:
  push:
    branches: [main]
    paths:
      - "scripts/bake-client.mjs"

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bake V11 into public index
        run: node scripts/bake-client.mjs
      - name: Commit baked public client
        shell: bash
        run: |
          if git diff --quiet -- public/index.html; then
            echo "public/index.html is already baked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Bake opaque V11 client into public/index.html"
          git push
